name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        env:
          # Set the repository variable API_BASE_URL, for example https://powerplay-store-api.onrender.com/api/v1
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
      # Pages has no server-side routing: serve the app shell for deep links such as /cart.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      # Free hosts sleep when idle, so allow a long warm-up before failing.
      - name: API answers and serves the seeded catalogue
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ vars.API_BASE_URL }}/products?pageSize=2" | tee /dev/stderr | grep -q '"items"'
