# One command: docker compose up --build
#   web  http://localhost:3000   (React, nginx proxies /api to the API)
#   api  http://localhost:8080   (ASP.NET Core)
#   cosmos emulator explorer http://localhost:1234
# The emulator account key below is the published, well-known emulator key. It protects nothing and is not a secret.
services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "http"]
    ports: ["8081:8081", "1234:1234"]

  api:
    build: { context: ., dockerfile: src/IplStore.Api/Dockerfile }
    depends_on: [cosmos]
    ports: ["8080:8080"]
    environment:
      Storage__Provider: Cosmos
      Cosmos__ConnectionString: "AccountEndpoint=http://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
      Cosmos__UseGatewayMode: "true"
      # Demo only: lets the UI sign in as Asha, Ravi or an admin without an identity provider. Never enable in production.
      Auth__EnableDevTokens: "true"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-compose-demo-signing-key-change-me-0123456789}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/live HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      retries: 12

  web:
    build: { context: ./web }
    depends_on: [api]
    ports: ["3000:80"]
